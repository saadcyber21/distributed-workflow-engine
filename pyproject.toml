[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-workflow-engine"
version = "0.1.0"
description = "Workflow orchestration with retries, dead letters, tracing, Kafka, and safe LLM actions."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "pydantic>=2.8,<3", "openai>=1.50,<3"]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.5,<3"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
